[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "meridian"
version = "0.1.0"
description = "Hybrid RAG pipeline with cluster-aware retrieval, MMR re-ranking, and cited generation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Om Raut" }]
dependencies = [
    "anthropic>=1.8,<2",
    "defusedxml>=0.7",
    "fastapi>=0.141",
    "fastembed>=0.8",
    "httpx>=0.28",
    "numpy>=2.4",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "qdrant-client>=1.19,<2",
    "scikit-learn>=1.9",
    "structlog>=26.1",
    "tenacity>=9.1",
    "typer>=0.27",
    "uvicorn[standard]>=0.54",
    "voyageai>=0.5,<0.6",
]

[project.optional-dependencies]
eval = ["matplotlib>=3.11"]
dev = [
    "matplotlib>=3.11",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[project.scripts]
meridian = "meridian.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests call paid APIs; opt in with `pytest -m integration`.
addopts = "-m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: runs against live Qdrant, Voyage AI, and Claude"]
filterwarnings = ["error::DeprecationWarning:meridian.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "D", "ANN", "BLE", "TRY"]
ignore = ["D105", "D107", "TRY003", "ANN401", "RUF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "sklearn.*", "defusedxml.*"]
ignore_missing_imports = true
